version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: terminal-mgmt-db
    environment:
      POSTGRES_DB: terminal_management
      POSTGRES_USER: terminal
      POSTGRES_PASSWORD: terminal_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terminal -d terminal_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: terminal-mgmt-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/terminal_management
      SPRING_DATASOURCE_USERNAME: terminal
      SPRING_DATASOURCE_PASSWORD: terminal_password
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: terminal-mgmt-web
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:
