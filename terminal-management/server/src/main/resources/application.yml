spring:
  application:
    name: terminal-management

  datasource:
    url: jdbc:postgresql://localhost:5432/terminal_management
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  port: 8080

logging:
  level:
    com.terminal.management: DEBUG
    org.hibernate.SQL: DEBUG
